# Blueprint de Render: un servicio web (Django + gunicorn) y una base PostgreSQL.
# En render.com: New > Blueprint > elegir este repositorio. Render crea ambos recursos.
services:
  - type: web
    name: psps-control-sqa
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: psps-sqa-db
          property: connectionString

databases:
  - name: psps-sqa-db
    plan: free
    databaseName: psps_sqa
    user: psps
